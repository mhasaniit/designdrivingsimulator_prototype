<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wet Road · Highway Decisions</title><style>
:root{color-scheme:dark;--cyan:#00d9ee;--panel:#071521ee;--muted:#aac0cd}*{box-sizing:border-box}body{margin:0;background:#030b12;color:#f4fbff;font:16px/1.45 system-ui,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}button:disabled{opacity:.45;cursor:default}.app{max-width:1672px;margin:auto;position:relative}.setup{position:relative;aspect-ratio:1672/941}.setup>img{width:100%;height:100%;display:block}.hot{position:absolute;border:2px solid transparent;border-radius:14px;background:transparent;color:transparent}.hot:hover{border-color:var(--cyan);background:#00d9ee18}.hot.selected{border:4px solid var(--cyan);box-shadow:0 0 24px #00d9ee88}.hot.selected:after{content:'✓';position:absolute;right:6px;top:5px;border-radius:50%;background:var(--cyan);color:#00111a;font-size:24px;width:30px}.hot.enabled{color:#00111a;background:var(--cyan);font-size:clamp(13px,2vw,30px);font-weight:750}.topbar{padding:12px 24px;border-bottom:1px solid #224052;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:13px;letter-spacing:.14em;font-weight:800}.small{font-size:12px;color:var(--muted)}.scene{min-height:770px;height:min(900px,calc(100svh - 48px));position:relative;isolation:isolate;overflow:hidden;background:#132b37}.road{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:filter .5s,transform 1s}.scene.braking .road{transform:scale(.98);filter:brightness(.88)}.scene.turning .road{transform:translateX(2%) rotate(-1deg) scale(1.05)}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(#020a1433,transparent 45%,#020a14cc);z-index:-1;pointer-events:none}.hud{display:flex;justify-content:space-between;gap:16px;padding:22px}.speedbox{background:var(--panel);border:1px solid #395668;border-radius:15px;padding:12px 22px;display:flex;gap:24px;align-items:center;min-width:265px}.speedvalue{font-size:48px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}.speedvalue small{font-size:14px;color:var(--muted)}.telemetry{text-align:right;background:var(--panel);border:1px solid #395668;border-radius:15px;padding:14px 20px}.progress{display:flex;gap:7px;margin-top:8px}.progress span{width:56px;height:4px;background:#3e5360}.progress span.done{background:var(--cyan)}.prompt{position:absolute;top:135px;left:22px;width:min(490px,43%);background:var(--panel);border:1px solid #456375;border-radius:16px;padding:20px 24px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan);font-weight:800}.prompt h1{font-size:clamp(23px,2.5vw,38px);margin:8px 0 10px;line-height:1.12}.prompt p{margin:0;color:#d8e8ef;font-size:15px}.cue{margin-top:15px;padding-top:13px;border-top:1px solid #395464;font-size:13px;color:#bcd6df}.cockpit{position:absolute;bottom:18px;left:22px;right:22px;background:linear-gradient(140deg,#152430f5,#020c15f5);border:1px solid #466171;border-radius:20px;padding:16px 22px;display:grid;grid-template-columns:1fr 1.5fr;gap:24px;box-shadow:0 18px 50px #0008}.instrument h2{font-size:18px;margin:0 0 8px}.instrument p{font-size:13px;color:var(--muted);max-width:340px;margin:5px 0}.meter{height:10px;background:#223c49;border-radius:10px;margin:12px 0;position:relative;overflow:hidden}.meter>div{height:100%;background:var(--cyan);transition:width .12s}.pedals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.control{touch-action:none;user-select:none;-webkit-user-select:none;background:#0c1b27;border:1px solid #3b5362;border-radius:14px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-height:156px}.control:hover{border-color:var(--cyan);background:#143140}.control img{height:100px;width:110px;object-fit:contain;pointer-events:none;transition:transform .15s;filter:drop-shadow(0 6px 5px #0009)}.control .wheel{width:120px}.control.pressed img{transform:perspective(200px) rotateX(25deg) translateY(8px) scale(.95)}.control.turn img{transform:rotate(-65deg)}.control strong{font-size:14px;margin-top:4px}.control small{font-size:11px;color:var(--muted)}.secondary,.primary{border-radius:10px;padding:11px 19px;border:1px solid #3f6476;background:#0c2231;color:white;font-weight:700}.primary{background:var(--cyan);border-color:var(--cyan);color:#00141d}.maintain{font-size:13px;padding:8px 14px;margin-top:8px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#010b1670;padding:24px;backdrop-filter:blur(5px);z-index:5}.card{background:#071724f7;border:1px solid #508092;border-radius:22px;padding:30px 36px;width:min(760px,100%);box-shadow:0 25px 80px #0008}.card h1{font-size:clamp(26px,3.2vw,44px);line-height:1.1;margin:10px 0 16px}.card p{color:#d3e3ec}.card ul{padding-left:22px;color:#d3e3ec}.card li{margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.badge{display:inline-block;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:800;background:#075546;color:#8ff0cf}.badge.unsafe{background:#601b32;color:#ffb8c7}.summary{display:grid;gap:8px;margin-top:16px}.summary div{padding:10px 12px;background:#102c3a;border-radius:8px;font-size:14px}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 24px;color:var(--muted);font-size:12px}.footer button{font-size:12px}.live-note{color:var(--cyan);font-size:13px;min-height:20px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:700px){.topbar{padding:10px 14px}.scene{min-height:920px;height:auto}.hud{padding:12px;gap:8px}.speedbox{min-width:0;padding:10px;gap:10px}.speedvalue{font-size:34px}.telemetry{padding:10px;font-size:12px}.progress span{width:30px}.prompt{top:110px;left:12px;right:12px;width:auto;padding:16px;background:#071521dc}.prompt h1{font-size:27px}.cockpit{left:12px;right:12px;bottom:14px;grid-template-columns:1fr;padding:15px;gap:12px}.control{min-height:145px}.control img{width:80px;height:84px}.control .wheel{width:90px}.control strong{font-size:12px}.control small{font-size:10px}.card{padding:22px}.footer{padding:10px 14px}.setup{min-height:0}.hot{border-radius:5px}.hot.selected:after{font-size:12px;width:16px;height:16px}.brand{font-size:11px}.small{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="app"><header class="topbar"><span class="brand">WET ROAD / HIGHWAY DECISIONS</span><span class="small">GEM 380 · Interactive study prototype</span></header><main id="main"></main><footer class="footer"><span id="status" role="status" aria-live="polite">Ready to drive</span><button class="secondary" id="restart">Main menu</button></footer></div><script>
'use strict';
const main=document.querySelector('#main'),statusEl=document.querySelector('#status');
const times=['Dawn','Morning','Afternoon','Evening','Night'];let time='Evening',selected=false,stage=0,phase='menu',speed=70,results=[null,null,null],tick=null,delay=null;
const scenarios=[
{title:'Brake lights ahead',start:70,target:50,art:'follow',story:'The truck ahead is braking. Spray limits your view, and a car is in the left lane. What do you do?',cue:'Observe: brake lights ahead · occupied left lane · wet pavement',goal:'Traffic ahead: approximately 50 mph. Watch your closing speed.',reason:'The vehicle ahead is slowing and the next lane is occupied. Smooth braking creates time and space without a sudden lane change.'},
{title:'An opportunity to pass?',start:65,target:55,art:'follow',story:'You are catching a slower truck. You could try to pass, but a car is beside you in the left lane. What do you do?',cue:'Observe: truck ahead · car alongside · limited view through spray',goal:'Traffic ahead: approximately 55 mph. Consider the available space.',reason:'An occupied passing lane and poor visibility make this a poor moment to overtake. Slow behind the truck and wait for a clear, safe opportunity.'},
{title:'Your exit is coming up',start:60,target:40,art:'exit',story:'Your exit is close and the sedan ahead slows down. A car is in the left lane. Do you slow down or try to get ahead?',cue:'Observe: slowing sedan · exit on right · car in passing lane',goal:'Traffic near the exit: approximately 40 mph. Plan your approach.',reason:'Stay behind the slowing vehicle and reduce speed progressively. If you cannot take the exit safely, continue and use the next one instead of forcing a manoeuvre.'}
];
function stop(){clearInterval(tick);clearTimeout(delay);tick=null;delay=null;document.querySelectorAll('.pressed,.turn').forEach(e=>e.classList.remove('pressed','turn'))}
function announce(s){statusEl.textContent=s}
function hot(label,x,y,w,h,fn,cls=''){const b=document.createElement('button');b.className='hot '+cls;b.textContent=label;b.setAttribute('aria-label',label);Object.assign(b.style,{left:x/16.72+'%',top:y/9.41+'%',width:w/16.72+'%',height:h/9.41+'%'});b.onclick=fn;main.querySelector('.setup').append(b);return b}
function setup(p){stop();phase=p;let file=p==='menu'?'01-start-screen-edited.png':p==='vehicle'?'02-vehicle-selection-edited.png':'conditions-screen-unselected.png';main.innerHTML='<section class="setup"><img src="'+file+'" alt="'+(p==='menu'?'Wet Road Driving Simulator':p==='vehicle'?'Choose your vehicle':'Set your conditions')+'"></section>';if(p==='menu'){hot('Start drive',573,652,525,82,()=>{selected=false;setup('vehicle')})}if(p==='vehicle'){hot('Select Sedan',462,286,368,461,()=>{selected=true;setup('vehicle')},selected?'selected':'');const b=hot('Continue',1344,814,268,71,()=>setup('conditions'),selected?'enabled':'');b.disabled=!selected;hot('Back',58,814,212,71,()=>setup('menu'))}if(p==='conditions'){times.forEach((t,i)=>hot('Select '+t,80+i*306,197,291,181,()=>{time=t;setup('conditions')},time===t?'selected':''));hot('Back',47,800,285,88,()=>setup('vehicle'));hot('Start highway drive',1338,800,293,88,()=>{results=[null,null,null];stage=0;intro()})}announce(p==='conditions'?'Selected: '+time+' · Rain · Sedan':'Choose your drive')}
function scene(s){main.innerHTML='<section class="scene" id="scene"><img class="road" src="highway-'+s.art+'-'+time.toLowerCase()+'.png" alt="Rainy '+time.toLowerCase()+' highway: '+(s.art==='exit'?'slowing sedan near an exit and traffic in the left lane':'truck ahead with a car occupying the passing lane')+'"><div class="hud"><div class="speedbox"><div><div class="small">SPEED</div><div class="speedvalue"><span id="speed">'+Math.round(speed)+'</span> <small>mph</small></div></div><div class="small">ROAD<br><strong style="color:white">Wet · '+time+'</strong></div></div><div class="telemetry"><div class="eyebrow">DECISION '+(stage+1)+' / 3</div><div class="progress">'+scenarios.map((_,i)=>'<span class="'+(i<=stage?'done':'')+'"></span>').join('')+'</div><div class="small" style="margin-top:8px">Plan ahead. Leave space.</div></div></div><div id="layer"></div></section>'}
function overlay(html){document.querySelector('#layer').innerHTML='<div class="overlay"><section class="card" aria-label="Scenario information">'+html+'</section></div>';const focus=document.querySelector('.card button');if(focus)focus.focus()}
function intro(){['highway-follow-','highway-exit-'].forEach(p=>{const img=new Image();img.src=p+time.toLowerCase()+'.png'});['wheel','brake','accelerator'].forEach(p=>{const img=new Image();img.src='control-'+p+'.png'});phase='intro';speed=70;scene(scenarios[0]);overlay('<div class="eyebrow">A longer drive · Three decisions</div><h1>Read the road.<br>Control your response.</h1><p>You begin at <strong>70 mph in rain</strong>. This is the scenario’s starting speed, not a recommended wet-weather speed. Adjust to the traffic you see.</p><ul><li>Read the situation, then <strong>click one control</strong>: brake, accelerate, or overtake.</li><li>The speed change happens automatically. <strong>No holding or timing a release.</strong></li><li>Keyboard: <strong>B / Space</strong> brake, <strong>A / ↑</strong> accelerate, <strong>O / ←</strong> overtake.</li></ul><p class="small">No countdown. No real vehicle. Speeds and controls are illustrative; this is not a physics-based driving lesson. Your choices stay in this browser session.</p><div class="actions"><button class="primary" id="begin">Begin highway drive</button></div>');document.querySelector('#begin').onclick=()=>drive();announce('Three decisions. Read the road, then click your response.')}
function drive(){stop();phase='decision';speed=scenarios[stage].start;const s=scenarios[stage];scene(s);document.querySelector('#layer').innerHTML='<article class="prompt"><div class="eyebrow">'+(stage===0?'Traffic changes':'Read the situation')+'</div><h1>'+s.title+'</h1><p>'+s.story+'</p><div class="cue">'+s.cue+'</div></article><section class="cockpit" aria-label="Driving controls"><div class="instrument"><h2>Choose your response</h2><p>Read the situation. Click one response.</p><div class="meter" aria-hidden="true"><div id="meter" style="width:'+speed+'%"></div></div><div class="live-note" id="motion">Read the traffic before acting.</div><p>No time limit. Speed changes automatically.</p></div><div class="pedals"><button class="control" id="overtake" aria-label="Overtake using steering wheel"><img class="wheel" src="control-wheel.png" alt=""><strong>Attempt overtake</strong><small>Turn · O / ←</small></button><button class="control" id="brake" aria-label="Brake smoothly"><img src="control-brake.png" alt=""><strong>Brake smoothly</strong><small>Click · B / Space</small></button><button class="control" id="accelerator" aria-label="Accelerate"><img src="control-accelerator.png" alt=""><strong>Accelerate</strong><small>Click · A / ↑</small></button></div></section>';
for(const name of ['brake','accelerator'])document.querySelector('#'+name).onclick=()=>choose(name);
document.querySelector('#overtake').onclick=()=>overtake();announce(s.title+' · '+time+' · '+speed+' mph')}
function updateSpeed(){const n=document.querySelector('#speed');if(n)n.textContent=Math.round(speed);const bar=document.querySelector('#meter');if(bar)bar.style.width=speed+'%'}
function choose(action){if(phase!=='decision')return;phase='animating';const from=speed,to=action==='brake'?scenarios[stage].target:from+5;document.querySelector('#'+action).classList.add('pressed');document.querySelector('#scene').classList.toggle('braking',action==='brake');document.querySelector('#motion').textContent=action==='brake'?'Slowing smoothly…':'Accelerating…';document.querySelectorAll('.control').forEach(b=>b.disabled=true);const started=performance.now();tick=setInterval(()=>{const progress=Math.min(1,(performance.now()-started)/1000);speed=from+(to-from)*progress;updateSpeed();if(progress===1)finish(action)},40)}
function overtake(){if(phase!=='decision')return;phase='animating';document.querySelector('#overtake').classList.add('turn');document.querySelector('#scene').classList.add('turning');document.querySelectorAll('.control').forEach(b=>b.disabled=true);delay=setTimeout(()=>finish('overtake'),450)}
function assess(action,current,s){if(action==='brake')return {safe:true,label:'Good decision',text:s.reason};if(action==='overtake')return {safe:false,label:'Passing lane occupied',text:'Turning toward the passing lane conflicts with the car alongside you. Stay in your lane and create space by slowing. '+s.reason};if(action==='accelerator')return {safe:false,label:'Closing speed increased',text:'Acceleration raised your speed to '+Math.round(current)+' mph while traffic ahead was slowing. That leaves less time and room. '+s.reason};return {safe:false,label:'Gap still shrinking',text:'Keeping '+Math.round(current)+' mph does not respond to the slowing traffic. '+s.reason}}
function finish(action){stop();phase='feedback';const s=scenarios[stage],outcome=assess(action,speed,s);if(!results[stage])results[stage]={action,speed:Math.round(speed),safe:outcome.safe,title:s.title};overlay('<span class="badge '+(outcome.safe?'':'unsafe')+'">'+outcome.label+'</span><h1>'+(outcome.safe?'Space is your advantage.':'Reconsider the traffic cues.')+'</h1><p>'+outcome.text+'</p><div class="summary"><div>Your response: <strong>'+({brake:'Brake',accelerator:'Accelerate',overtake:'Attempt overtake',maintain:'Maintain speed'}[action])+'</strong> · '+Math.round(speed)+' mph</div><div>Look for: '+s.cue.replace('Observe: ','')+'</div></div><p class="small">First attempts are used in the final summary. Practice retries do not replace them.</p><div class="actions">'+(!outcome.safe?'<button class="secondary" id="retry">Practice this decision</button>':'')+'<button class="primary" id="next">'+(stage<2?'Next road situation':'See driving benefits')+'</button></div>');if(document.querySelector('#retry'))document.querySelector('#retry').onclick=()=>drive();document.querySelector('#next').onclick=()=>{if(stage<2){stage++;drive()}else benefits()};announce(outcome.label+'. '+(outcome.safe?'Decision completed.':'Practice or continue.'))}
function benefits(){stop();phase='benefits';scene(scenarios[2]);const score=results.filter(r=>r?.safe).length;overlay('<div class="eyebrow">Safer driving benefits</div><h1>More time. More space.<br>Fewer rushed decisions.</h1><p>Smooth speed changes, a clear passing lane, and patience around exits help you preserve options on a wet road.</p><div class="summary">'+results.map((r,i)=>'<div><strong>'+(i+1)+'. '+r.title+'</strong><br>'+ (r.safe?'Controlled first response':'First response to reconsider')+' · '+r.action+' · '+r.speed+' mph</div>').join('')+'</div><p><strong>'+score+' / 3 controlled first responses</strong></p><p class="small">Braking is appropriate for the specific hazards shown here. It is not the answer to every driving situation. This score is prototype feedback, not a driving-safety assessment.</p><div class="actions"><button class="primary" id="complete">Finish drive</button></div>');document.querySelector('#complete').onclick=complete;announce('All three decisions complete. Review your first responses.')}
function complete(){stop();phase='complete';main.innerHTML='<section class="setup"><img src="De.png" alt="Drive complete. Thanks for trying the simulator."></section>';hot('Start over',623,532,289,69,()=>{results=[null,null,null];stage=0;intro()});hot('Main menu',932,534,263,67,()=>setup('menu'));announce('Drive complete · '+time+' · Three decisions reviewed')}
document.querySelector('#restart').onclick=()=>setup('menu');
const keyAction=k=>k===' '||k.toLowerCase()==='b'?'brake':k==='ArrowUp'||k.toLowerCase()==='a'?'accelerator':null;
document.addEventListener('keydown',e=>{if(phase!=='decision')return;const a=keyAction(e.key);if(a){e.preventDefault();if(!e.repeat)choose(a)}else if((e.key==='ArrowLeft'||e.key.toLowerCase()==='o')&&!e.repeat){e.preventDefault();overtake()}});setup('menu');
</script></body></html>
