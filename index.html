<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wet Road Driving Simulator</title><style>
*{box-sizing:border-box}body{margin:0;background:#030c14;color:#eafaff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;justify-content:center}main{position:relative;width:100%;max-width:1672px;margin:auto;aspect-ratio:1672/941;overflow:hidden}#scene{display:block;width:100%;height:100%}.hot{position:absolute;background:transparent;border:2px solid transparent;border-radius:12px;cursor:pointer;color:transparent;font-size:0}.hot:hover{background:#00e5ff18;border-color:#69efff}.hot:focus-visible{outline:4px solid white;outline-offset:3px;background:#00e5ff35}.hot.selected{border:4px solid #00e5ff;box-shadow:0 0 18px #00dfff;background:#00e5ff16}.hot.selected:after{content:'✓';position:absolute;right:7px;top:7px;background:#00e5ff;color:#001923;border-radius:100%;width:26px;height:26px;font-size:22px}#tools{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 20px;font-size:13px;color:#a9c8d8}#tools button{background:#102330;color:#d8faff;border:1px solid #376375;padding:8px 14px;border-radius:7px;cursor:pointer}#status{flex:1}#timer{color:#00e3ff}.extra{background:#031421ed;color:#00e5ff;font-size:clamp(10px,1.5vw,24px);border-color:#00dfff;font-weight:bold}.extra:hover{background:#06374a} @media(max-width:600px){#tools{font-size:11px;padding:9px;flex-wrap:wrap}.hot{border-radius:5px}.hot.selected{border-width:2px}.hot.selected:after{width:14px;height:14px;font-size:12px}}
.hot.enabled{background:#00cee9;color:#001923;font-size:clamp(12px,1.8vw,30px);font-weight:bold;border:2px solid #72f4ff}.hot:disabled{cursor:default}.hot:disabled:hover{background:transparent;border-color:transparent}</style><main aria-label="Interactive wet road driving scenario"><img id="scene" alt=""><div id="controls"></div></main><div id="tools"><span id="status" role="status" aria-live="polite"></span><span id="timer"></span><button id="auto" aria-pressed="true">Auto advance: on</button><button id="restart">Restart</button></div><script>
const files=['01-start-screen-edited.png','02-vehicle-selection-edited.png','conditions-screen-unselected.png','04-baseline-gameplay-edited.png','05-braking-decision-edited.png','06-positive-feedback-edited.png','06-explanatory-feedback-edited.png','sb.png','De.png'];
const titles=['Start screen','Choose your vehicle','Set your conditions','Drive normally. Watch the road ahead.','Lead car braking. Choose your response.','Great job! You braked early.','Maintaining speed was unsafe. Retry or continue to benefits.','Safer driving benefits','Drive complete'];
let page=0,vehicle=null,condition='Evening',automatic=true,timeout,interval,mode='Study drive';
const scene=document.querySelector('#scene'),controls=document.querySelector('#controls'),status=document.querySelector('#status'),timer=document.querySelector('#timer');
const variantFiles={3:'04-baseline-gameplay',4:'05-braking-decision',5:'06-brake-now-feedback',6:'06-explanatory-feedback',7:'07-safe-driving-benefits'};
function imageFor(n){return condition!=='Evening' && variantFiles[n] ? variantFiles[n]+'-'+condition.toLowerCase()+'.png' : files[n]}
function button(label,x,y,w,h,fn,cls=''){let b=document.createElement('button');b.className='hot '+cls;b.setAttribute('aria-label',label);b.title=label;b.textContent=label;Object.assign(b.style,{left:x/16.72+'%',top:y/9.41+'%',width:w/16.72+'%',height:h/9.41+'%'});b.onclick=fn;controls.append(b);return b}
function schedule(next,seconds){if(!automatic)return;let left=seconds;timer.textContent='Next screen in '+left+'s';interval=setInterval(()=>{left--;timer.textContent='Next screen in '+left+'s'},1000);timeout=setTimeout(()=>show(next),seconds*1000)}
function show(n){clearTimeout(timeout);clearInterval(interval);timer.textContent='';page=n;scene.src=imageFor(n);scene.alt=titles[n];controls.replaceChildren();status.textContent=titles[n]+(n>0?' · '+(vehicle||'Select Sedan')+' · '+condition:'');
if(n===0){button('Start drive',573,652,525,82,()=>{vehicle=null;show(1)})}
if(n===1){button('Select Sedan',462,286,368,461,()=>{vehicle='Sedan';show(1)},vehicle==='Sedan'?'selected':'');button('Back',58,814,212,71,()=>show(0));let next=button('Continue',1344,814,268,71,()=>show(2),vehicle?'enabled':'');next.disabled=!vehicle;}
if(n===2){['Dawn','Morning','Afternoon','Evening','Night'].forEach((v,i)=>button('Select '+v,80+i*306,197,291,181,()=>{condition=v;show(2)},condition===v?'selected':''));button('Back',47,800,285,88,()=>show(1));button('Start drive',1338,800,293,88,()=>show(3))}
if(n===3){button('Continue to lead car braking',1443,815,202,86,()=>show(4));schedule(4,5)}
if(n===4){button('Brake now',825,783,209,75,()=>show(5));button('Maintain speed',1052,783,222,75,()=>show(6))}
if(n===5){button('Continue to safer driving benefits',1143,812,176,62,()=>show(7));schedule(7,8)}
if(n===6){button('Retry braking decision',1166,803,135,56,()=>show(4));button('Continue to benefits',385,802,770,57,()=>show(7));schedule(7,12)}
if(n===7){button('Continue to drive complete',694,811,285,63,()=>show(8));schedule(8,10)}
if(n===8){button('Start over',623,532,289,69,()=>show(1));button('Main menu',932,534,263,67,()=>show(0))}
}
document.querySelector('#auto').onclick=function(){automatic=!automatic;this.textContent='Auto advance: '+(automatic?'on':'off');this.setAttribute('aria-pressed',automatic);show(page)};
document.querySelector('#restart').onclick=()=>{vehicle=null;condition='Evening';show(0)};files.forEach(f=>{let i=new Image();i.src=f});show(0);
</script></html>
